<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Có lỗi xảy ra')}"></head>
<body>
<div th:replace="~{layout/bo-icon :: boIcon}"></div>
<div th:replace="~{layout/fragments :: menu}"></div>

<main class="than">
    <div class="khung">
        <div class="trang-loi">
            <div class="trang-loi__ma" th:text="${status}">500</div>
            <h1>Có lỗi xảy ra</h1>
            <p th:text="${error}">Lỗi không xác định</p>
            <div class="hang-nut" style="justify-content:center">
                <a th:href="@{/}" class="nut">
                    Về trang chủ
                    <svg class="ic"><use xlink:href="#ic-mui-ten-phai"></use></svg>
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
<div th:replace="~{layout/fragments :: menuDienThoai}"></div>
</body>
</html>
