<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="theSanPham(sp)" class="sp-o">
<a class="sp" th:href="@{'/san-pham/' + ${sp.id}}">
    <span class="sp__anh">
        <img th:src="@{${sp.duongDanAnh}}" th:alt="${sp.tenSanPham}" loading="lazy">
        <span class="sp__giam" th:if="${sp.phanTramGiam > 0}" th:text="'-' + ${sp.phanTramGiam} + '%'">-20%</span>
        <span class="sp__het" th:unless="${sp.conHang}">Tạm hết hàng</span>
    </span>
    <span class="sp__hieu" th:text="${sp.thuongHieu != null} ? ${sp.thuongHieu.tenThuongHieu} : ' '">Bosch</span>
    <span class="sp__ten" th:text="${sp.tenSanPham}">Tên sản phẩm</span>
    <th:block th:with="diem=${@saoSanPham.cua(sp.id)}">
    <span class="sp__sao" th:if="${diem != null}"
          th:attr="aria-label='Đánh giá ' + ${diem.hienThi} + ' trên 5 sao, ' + ${diem.soLuong} + ' lượt'">
        <span class="sp__sao-nen" aria-hidden="true">★★★★★<span class="sp__sao-day" th:style="'width:' + ${diem.phanTram} + '%'">★★★★★</span></span>
        <b th:text="${diem.hienThi}">4,7</b>
        <span class="sp__sao-so" th:text="'(' + ${diem.soLuong} + ')'">(3)</span>
    </span>
    </th:block>
    <span class="sp__gia">
        <b th:text="${#numbers.formatInteger(sp.giaHienTai, 0, 'POINT')} + ' ₫'">0 ₫</b>
        <del th:if="${sp.phanTramGiam > 0}" th:text="${#numbers.formatInteger(sp.giaBan, 0, 'POINT')} + ' ₫'">0 ₫</del>
    </span>
</a>
<div class="sp__mua" th:if="${sp.conHang}">
    <button type="submit" class="nut nut--nho sp__mua-nut" form="form-mua-ngay" name="id" th:value="${sp.id}"
            th:attr="aria-label='Mua ngay ' + ${sp.tenSanPham}">Mua ngay</button>
</div>
</div>

</body>
</html>
