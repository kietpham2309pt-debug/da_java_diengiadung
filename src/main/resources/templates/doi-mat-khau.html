<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Đổi mật khẩu', false)}"></head>
<body>
<div th:replace="~{layout/bo-icon :: boIcon}"></div>
<div class="luoi-chuyen" id="luoi-chuyen" aria-hidden="true"></div>
<div th:replace="~{layout/fragments :: thanh}"></div>

<main>
    <div th:replace="~{layout/fragments :: banner('Đổi mật khẩu', 'Đặt mật khẩu mới cho tài khoản của bạn', 'banner-tai-khoan.jpg', 'Đổi mật khẩu')}"></div>

    <section class="muc muc--sat-banner">
        <div class="khung khung--hep">
            <p class="thong-bao thong-bao--loi alert alert-danger" th:if="${loiDoiMatKhau}" role="alert">
                <svg class="ic" aria-hidden="true"><use xlink:href="#ic-tn-canh-bao"></use></svg>
                <span th:text="${loiDoiMatKhau}">Mật khẩu hiện tại không đúng</span>
            </p>

            <div class="the-tk hien-dan">
                <form th:action="@{/ho-so/doi-mat-khau}" method="post" novalidate data-kiem-tra>
                    <div class="o-nhap">
                        <label class="form-label" for="matKhauCu">Mật khẩu hiện tại</label>
                        <input class="form-control" type="password" id="matKhauCu" name="matKhauCu" autocomplete="current-password" required>
                    </div>

                    <div class="o-nhap">
                        <label class="form-label" for="matKhauMoi">Mật khẩu mới</label>
                        <input class="form-control" type="password" id="matKhauMoi" name="matKhauMoi" autocomplete="new-password" minlength="6" required
                               data-sai="Mật khẩu mới phải có ít nhất 6 ký tự">
                        <span class="goi-y">Ít nhất 6 ký tự, khác mật khẩu hiện tại.</span>
                    </div>

                    <div class="o-nhap">
                        <label class="form-label" for="nhapLai">Nhập lại mật khẩu mới</label>
                        <input class="form-control" type="password" id="nhapLai" name="nhapLai" autocomplete="new-password" minlength="6" required
                               data-giong="matKhauMoi" data-sai="Mật khẩu nhập lại chưa khớp với mật khẩu mới">
                    </div>

                    <button type="submit" class="nut nut--dac the-tk__gui btn">Đổi mật khẩu</button>
                </form>

                <p class="the-tk__doi"><a th:href="@{/ho-so}">Quay lại hồ sơ</a></p>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
<div th:replace="~{layout/fragments :: menuNho}"></div>
</body>
</html>
