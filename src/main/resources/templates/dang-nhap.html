<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Đăng nhập')}"></head>
<body>
<div th:replace="~{layout/fragments :: menu}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3">Đăng nhập</h1>
                    <div th:replace="~{layout/fragments :: thongBao}"></div>
                    <div class="alert alert-danger" th:if="${loiDangNhap}" th:text="${loiDangNhap}"></div>

                    <form th:action="@{/dang-nhap}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="tenDangNhap">Tên đăng nhập</label>
                            <input class="form-control" id="tenDangNhap" name="tenDangNhap" required
                                   th:value="${tenDangNhapCu}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="matKhau">Mật khẩu</label>
                            <input class="form-control" id="matKhau" name="matKhau" type="password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
                    </form>

                    <p class="mt-3 mb-0 text-center">
                        Chưa có tài khoản? <a th:href="@{/dang-ky}">Đăng ký</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
</body>
</html>
