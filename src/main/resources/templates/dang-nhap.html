<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Đăng nhập', false)}"></head>
<body>
<div th:replace="~{layout/bo-icon :: boIcon}"></div>
<div class="luoi-chuyen" id="luoi-chuyen" aria-hidden="true"></div>
<div th:replace="~{layout/fragments :: thanh}"></div>

<main>
    <div th:replace="~{layout/fragments :: banner('Đăng nhập', 'Đăng nhập để theo dõi đơn hàng và lưu địa chỉ giao.', 'banner-tai-khoan.jpg', 'Đăng nhập')}"></div>

    <section class="muc muc--sat-banner">
        <div class="khung khung--hep">
            <div th:replace="~{layout/fragments :: thongBao}"></div>

            <p class="thong-bao thong-bao--loi" th:if="${loiDangNhap}" role="alert">
                <svg class="ic" aria-hidden="true"><use xlink:href="#ic-tn-canh-bao"></use></svg>
                <span th:text="${loiDangNhap}">Sai tên đăng nhập hoặc mật khẩu</span>
            </p>

            <div class="the-tk hien-dan">
                <form th:action="@{/dang-nhap}" method="post">
                    <div class="o-nhap">
                        <label for="tenDangNhap">Tên đăng nhập</label>
                        <input type="text" id="tenDangNhap" name="tenDangNhap" required
                               autocomplete="username" th:value="${tenDangNhapCu}" placeholder="admin">
                    </div>

                    <div class="o-nhap">
                        <label for="matKhau">Mật khẩu</label>
                        <input type="password" id="matKhau" name="matKhau" required autocomplete="current-password">
                    </div>

                    <button type="submit" class="nut nut--dac the-tk__gui">Đăng nhập</button>
                </form>

                <p class="the-tk__doi">
                    Chưa có tài khoản?
                    <a th:href="@{/dang-ky}">Đăng ký ngay</a>
                </p>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
<div th:replace="~{layout/fragments :: menuNho}"></div>
</body>
</html>
