<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Trang chủ')}"></head>
<body>
<div th:replace="~{layout/fragments :: menu}"></div>

<main class="container py-4">
    <div th:replace="~{layout/fragments :: thongBao}"></div>

    <div class="p-4 mb-4 bg-white rounded shadow-sm">
        <h1 class="h3">Thiết bị điện gia dụng chính hãng</h1>
        <p class="text-muted mb-0">Bếp từ, máy hút mùi, máy rửa chén, máy giặt từ Bosch, Kaff, Kocher, Chef's.</p>
    </div>

    <h2 class="h5 mb-3">Danh mục sản phẩm</h2>
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-4 col-lg-2" th:each="loai : ${danhSachLoai}">
            <a class="btn btn-outline-secondary w-100 h-100 d-flex align-items-center justify-content-center"
               th:href="@{/san-pham(loai=${loai.id})}" th:text="${loai.tenLoai}">Bếp từ</a>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(danhSachLoai)}">
            <p class="text-muted">Chưa có danh mục nào. Đăng nhập trang quản trị để thêm.</p>
        </div>
    </div>

    <h2 class="h5 mb-3">Sản phẩm mới</h2>
    <div class="row g-3">
        <div class="col-6 col-md-4 col-lg-3" th:each="sp : ${sanPhamMoi}">
            <div class="card the-san-pham">
                <img class="anh-san-pham" th:if="${sp.hinhAnh != null}" th:src="@{'/uploads/' + ${sp.hinhAnh}}"
                     th:alt="${sp.tenSanPham}">
                <div class="anh-trong" th:if="${sp.hinhAnh == null}" th:text="${sp.tenSanPham}">Chưa có ảnh</div>
                <div class="card-body">
                    <div class="small text-muted" th:text="${sp.thuongHieu != null} ? ${sp.thuongHieu.tenThuongHieu} : ''">Bosch</div>
                    <div class="fw-semibold" th:text="${sp.tenSanPham}">Tên sản phẩm</div>
                    <div class="mt-2">
                        <span class="gia-ban" th:text="${#numbers.formatInteger(sp.giaHienTai, 0, 'POINT')} + ' đ'">0 đ</span>
                        <span class="gia-cu ms-1" th:if="${sp.giaKhuyenMai != null}"
                              th:text="${#numbers.formatInteger(sp.giaBan, 0, 'POINT')} + ' đ'">0 đ</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(sanPhamMoi)}">
            <p class="text-muted">Chưa có sản phẩm nào trong cơ sở dữ liệu.</p>
        </div>
    </div>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
</body>
</html>
