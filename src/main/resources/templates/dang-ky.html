<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Đăng ký', false)}"></head>
<body>
<div th:replace="~{layout/bo-icon :: boIcon}"></div>
<div class="luoi-chuyen" id="luoi-chuyen" aria-hidden="true"></div>
<div th:replace="~{layout/fragments :: thanh}"></div>

<main>
    <div th:replace="~{layout/fragments :: banner('Đăng ký', 'Tạo tài khoản để mua hàng nhanh hơn ở lần sau.', 'banner-tai-khoan.jpg', 'Đăng ký')}"></div>

    <section class="muc muc--sat-banner">
        <div class="khung khung--hep">
            <p class="thong-bao thong-bao--loi" th:if="${loiDangKy}" role="alert">
                <svg class="ic" aria-hidden="true"><use xlink:href="#ic-tn-canh-bao"></use></svg>
                <span th:text="${loiDangKy}">Tên đăng nhập đã có người dùng</span>
            </p>

            <div class="the-tk hien-dan">
                <form th:action="@{/dang-ky}" th:object="${taiKhoan}" method="post">
                    <div class="o-nhap">
                        <label for="tenDangNhap">Tên đăng nhập</label>
                        <input type="text" id="tenDangNhap" th:field="*{tenDangNhap}" autocomplete="username">
                        <span class="loi-nhap" th:if="${#fields.hasErrors('tenDangNhap')}" th:errors="*{tenDangNhap}"></span>
                    </div>

                    <div class="o-nhap">
                        <label for="matKhau">Mật khẩu</label>
                        <input type="password" id="matKhau" th:field="*{matKhau}" autocomplete="new-password">
                        <span class="goi-y">Ít nhất 6 ký tự.</span>
                        <span class="loi-nhap" th:if="${#fields.hasErrors('matKhau')}" th:errors="*{matKhau}"></span>
                    </div>

                    <div class="o-nhap">
                        <label for="hoTen">Họ và tên</label>
                        <input type="text" id="hoTen" th:field="*{hoTen}">
                        <span class="loi-nhap" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></span>
                    </div>

                    <div class="o-nhap">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}" placeholder="ban@gmail.com">
                        <span class="loi-nhap" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <div class="o-nhap">
                        <label for="soDienThoai">Số điện thoại</label>
                        <input type="tel" id="soDienThoai" name="soDienThoai" th:value="${soDienThoai}">
                    </div>

                    <div class="o-nhap">
                        <label for="diaChi">Địa chỉ</label>
                        <input type="text" id="diaChi" name="diaChi" th:value="${diaChi}">
                    </div>

                    <button type="submit" class="nut nut--dac the-tk__gui">Đăng ký</button>
                </form>

                <p class="the-tk__doi">
                    Đã có tài khoản?
                    <a th:href="@{/dang-nhap}">Đăng nhập</a>
                </p>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
<div th:replace="~{layout/fragments :: menuNho}"></div>
</body>
</html>
