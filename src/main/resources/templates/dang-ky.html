<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Đăng ký', false)}"></head>
<body>
<div th:replace="~{layout/bo-icon :: boIcon}"></div>
<div class="luoi-chuyen" id="luoi-chuyen" aria-hidden="true"></div>
<div th:replace="~{layout/fragments :: thanh}"></div>

<main>
    <div th:replace="~{layout/fragments :: banner('Đăng ký', 'Tạo tài khoản để mua hàng nhanh hơn ở lần sau.', 'banner-tai-khoan.jpg', 'Đăng ký')}"></div>

    <section class="muc muc--sat-banner">
        <div class="khung khung--hep">
            <p class="thong-bao thong-bao--loi alert alert-danger" th:if="${loiDangKy}" role="alert">
                <svg class="ic" aria-hidden="true"><use xlink:href="#ic-tn-canh-bao"></use></svg>
                <span th:text="${loiDangKy}">Tên đăng nhập đã có người dùng</span>
            </p>

            <div class="the-tk hien-dan">
                <form th:action="@{/dang-ky}" th:object="${taiKhoan}" method="post" novalidate data-kiem-tra>
                    <div th:replace="~{layout/fragments :: tomTatLoi}"></div>
                    <div class="o-nhap">
                        <label class="form-label" for="tenDangNhap">Tên đăng nhập</label>
                        <input class="form-control" type="text" id="tenDangNhap" th:field="*{tenDangNhap}" autocomplete="username" required minlength="4" maxlength="50"
                               data-sai="Tên đăng nhập phải từ 4 đến 50 ký tự">
                        <span class="loi-nhap invalid-feedback d-block" th:if="${#fields.hasErrors('tenDangNhap')}" th:text="${@tomTatLoi.thongBaoCua(#fields.detailedErrors(), 'tenDangNhap')}"></span>
                    </div>

                    <div class="o-nhap">
                        <label class="form-label" for="matKhau">Mật khẩu</label>
                        <input class="form-control" type="password" id="matKhau" th:field="*{matKhau}" autocomplete="new-password" required minlength="6"
                               data-sai="Mật khẩu phải có ít nhất 6 ký tự">
                        <span class="goi-y">Ít nhất 6 ký tự.</span>
                        <span class="loi-nhap invalid-feedback d-block" th:if="${#fields.hasErrors('matKhau')}" th:text="${@tomTatLoi.thongBaoCua(#fields.detailedErrors(), 'matKhau')}"></span>
                    </div>

                    <div class="o-nhap">
                        <label class="form-label" for="hoTen">Họ và tên</label>
                        <input class="form-control" type="text" id="hoTen" th:field="*{hoTen}" required autocomplete="name">
                        <span class="loi-nhap invalid-feedback d-block" th:if="${#fields.hasErrors('hoTen')}" th:text="${@tomTatLoi.thongBaoCua(#fields.detailedErrors(), 'hoTen')}"></span>
                    </div>

                    <div class="o-nhap">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" type="email" id="email" th:field="*{email}" placeholder="ban@gmail.com"
                               data-sai="Email chưa đúng định dạng, ví dụ: ten@gmail.com">
                        <span class="loi-nhap invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:text="${@tomTatLoi.thongBaoCua(#fields.detailedErrors(), 'email')}"></span>
                    </div>

                    <div class="o-nhap">
                        <label class="form-label" for="soDienThoai">Số điện thoại</label>
                        <input class="form-control" type="tel" id="soDienThoai" name="soDienThoai" th:value="${soDienThoai}" pattern="0\d{9}" maxlength="10"
                               inputmode="tel" data-sai="Số điện thoại phải gồm đúng 10 chữ số và bắt đầu bằng 0">
                    </div>

                    <div class="o-nhap">
                        <label class="form-label" for="diaChi">Địa chỉ</label>
                        <input class="form-control" type="text" id="diaChi" name="diaChi" th:value="${diaChi}">
                    </div>

                    <button type="submit" class="nut nut--dac the-tk__gui btn">Đăng ký</button>
                </form>

                <p class="the-tk__doi">
                    Đã có tài khoản?
                    <a th:href="@{/dang-nhap}">Đăng nhập</a>
                </p>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
<div th:replace="~{layout/fragments :: menuNho}"></div>
</body>
</html>
