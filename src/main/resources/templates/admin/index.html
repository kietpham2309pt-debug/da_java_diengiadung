<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Tổng quan')}"></head>
<body>
<div th:replace="~{layout/bo-icon :: boIcon}"></div>
<div th:replace="~{layout/fragments :: menu}"></div>

<main class="than than--kem">
    <div class="khung">
        <div class="bo-cuc-qt">
            <div th:replace="~{layout/fragments :: menuQuanTri('tong-quan')}"></div>

            <div>
                <div class="dau-trang">
                    <div>
                        <h1>Tổng quan</h1>
                        <p>Số liệu nhanh của cửa hàng.</p>
                    </div>
                </div>

                <div th:replace="~{layout/fragments :: thongBao}"></div>

                <div class="luoi-thong-ke">
                    <div class="o-so">
                        <div class="o-so__nhan">Loại sản phẩm</div>
                        <div class="o-so__gia-tri" th:text="${soLoai}">0</div>
                    </div>
                    <div class="o-so">
                        <div class="o-so__nhan">Thương hiệu</div>
                        <div class="o-so__gia-tri" th:text="${soThuongHieu}">0</div>
                    </div>
                    <div class="o-so">
                        <div class="o-so__nhan">Sản phẩm</div>
                        <div class="o-so__gia-tri" th:text="${soSanPham}">0</div>
                    </div>
                    <div class="o-so">
                        <div class="o-so__nhan">Tài khoản</div>
                        <div class="o-so__gia-tri" th:text="${soTaiKhoan}">0</div>
                    </div>
                    <div class="o-so o-so--nhac">
                        <div class="o-so__nhan">Đơn chờ xác nhận</div>
                        <div class="o-so__gia-tri" th:text="${soDonChoXacNhan}">0</div>
                    </div>
                </div>

                <div class="the-trang">
                    <div class="the-trang__dau">
                        <h2>Sản phẩm sắp hết hàng</h2>
                        <span class="the-nhan the-nhan--cho">Tồn kho từ 5 trở xuống</span>
                    </div>

                    <div class="khung-bang" th:if="${not #lists.isEmpty(sanPhamSapHet)}">
                        <table class="bang-dl">
                            <thead>
                            <tr>
                                <th>Mã</th>
                                <th>Tên sản phẩm</th>
                                <th class="canh-giua">Tồn kho</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="sp : ${sanPhamSapHet}">
                                <td th:text="${sp.maSanPham}">MSP</td>
                                <td th:text="${sp.tenSanPham}">Tên</td>
                                <td class="canh-giua">
                                    <span class="the-nhan the-nhan--do" th:text="${sp.soLuongTon}">0</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="trang-trong" th:if="${#lists.isEmpty(sanPhamSapHet)}">
                        <svg class="ic"><use xlink:href="#ic-kiem"></use></svg>
                        <strong>Không có sản phẩm nào sắp hết hàng</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
<div th:replace="~{layout/fragments :: menuDienThoai}"></div>
</body>
</html>
