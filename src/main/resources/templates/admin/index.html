<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Tổng quan')}"></head>
<body>
<div th:replace="~{layout/fragments :: menu}"></div>

<main class="container py-4">
    <div class="row g-4">
        <div class="col-lg-3">
            <div th:replace="~{layout/fragments :: menuQuanTri('tong-quan')}"></div>
        </div>
        <div class="col-lg-9">
            <h1 class="h4 mb-3">Tổng quan hệ thống</h1>
            <div th:replace="~{layout/fragments :: thongBao}"></div>

            <div class="row g-3">
                <div class="col-6 col-md-4">
                    <div class="card o-thong-ke"><div class="card-body">
                        <div class="text-muted small">Loại sản phẩm</div>
                        <div class="h4 mb-0" th:text="${soLoai}">0</div>
                    </div></div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="card o-thong-ke"><div class="card-body">
                        <div class="text-muted small">Thương hiệu</div>
                        <div class="h4 mb-0" th:text="${soThuongHieu}">0</div>
                    </div></div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="card o-thong-ke"><div class="card-body">
                        <div class="text-muted small">Sản phẩm</div>
                        <div class="h4 mb-0" th:text="${soSanPham}">0</div>
                    </div></div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="card o-thong-ke"><div class="card-body">
                        <div class="text-muted small">Tài khoản</div>
                        <div class="h4 mb-0" th:text="${soTaiKhoan}">0</div>
                    </div></div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="card o-thong-ke"><div class="card-body">
                        <div class="text-muted small">Đơn chờ xác nhận</div>
                        <div class="h4 mb-0" th:text="${soDonChoXacNhan}">0</div>
                    </div></div>
                </div>
            </div>

            <h2 class="h5 mt-4">Sản phẩm sắp hết hàng</h2>
            <div class="table-responsive">
                <table class="table table-bordered bg-white align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Mã</th>
                        <th>Tên sản phẩm</th>
                        <th class="text-center">Tồn kho</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="sp : ${sanPhamSapHet}">
                        <td th:text="${sp.maSanPham}">MSP</td>
                        <td th:text="${sp.tenSanPham}">Tên</td>
                        <td class="text-center text-danger fw-semibold" th:text="${sp.soLuongTon}">0</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(sanPhamSapHet)}">
                        <td colspan="3" class="text-center text-muted">Không có sản phẩm nào sắp hết hàng</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
</body>
</html>
