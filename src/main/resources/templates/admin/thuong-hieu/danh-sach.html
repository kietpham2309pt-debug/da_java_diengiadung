<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Thương hiệu', false)}"></head>
<body>
<div th:replace="~{layout/bo-icon :: boIcon}"></div>
<div class="luoi-chuyen" id="luoi-chuyen" aria-hidden="true"></div>
<div th:replace="~{layout/fragments :: thanh}"></div>

<main>
    <section class="muc muc--dau-trang">
        <div class="khung">
            <nav class="duong-dan" aria-label="Đường dẫn phân cấp">
                <a th:href="@{/}">Trang chủ</a>
                <span aria-hidden="true">&middot;</span>
                <a th:href="@{/admin}">Quản trị</a>
                <span aria-hidden="true">&middot;</span>
                <span aria-current="page">Thương hiệu</span>
            </nav>

            <div class="qt">
                <div th:replace="~{layout/fragments :: menuQuanTri('thuong-hieu')}"></div>

                <div>
                    <div class="qt-dau">
                        <div>
                            <h1>Thương hiệu</h1>
                            <p>Quản lý danh sách các hãng sản xuất.</p>
                        </div>
                        <div class="qt-dau__nut">
                            <a class="nut nut--dac nut--nho" th:href="@{/admin/thuong-hieu/them}">Thêm hãng</a>
                        </div>
                    </div>

                    <div th:replace="~{layout/fragments :: thongBao}"></div>

                    <div class="thanh-loc">
                        <form th:action="@{/admin/thuong-hieu}" method="get">
                            <input type="search" name="tuKhoa" placeholder="Tìm theo tên hãng..." aria-label="Từ khoá">
                            <button class="nut nut--nho" type="submit">Tìm</button>
                        </form>
                    </div>

                    <div class="khoi" th:if="${not #lists.isEmpty(danhSach)}">
                        <div class="cuon-ngang">
                            <table class="bang-dl">
                                <thead>
                                <tr>
                                    <th>Tên thương hiệu</th>
                                    <th>Xuất xứ</th>
                                    <th class="canh-phai">Thao tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="item : ${danhSach}">
                                    <td th:text="${item.tenThuongHieu}"></td>
                                    <td th:text="${item.xuatXu}"></td>
                                    <td>
                                        <div class="hang-thao-tac">
                                            <a class="nut nut--nho" th:href="@{'/admin/thuong-hieu/sua/' + ${item.id}}">Sửa</a>
                                            <form th:action="@{'/admin/thuong-hieu/xoa/' + ${item.id}}" method="post">
                                                <button class="nut nut--nho nut--do" type="submit">Xoá</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
<div th:replace="~{layout/fragments :: menuNho}"></div>
</body>
</html>
