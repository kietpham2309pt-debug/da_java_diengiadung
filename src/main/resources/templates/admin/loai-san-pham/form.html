<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Loại sản phẩm')}"></head>
<body>
<div th:replace="~{layout/fragments :: menu}"></div>

<main class="container py-4">
    <div class="row g-4">
        <div class="col-lg-3">
            <div th:replace="~{layout/fragments :: menuQuanTri('loai-san-pham')}"></div>
        </div>
        <div class="col-lg-9">
            <h1 class="h4 mb-3" th:text="${loaiSanPham.id == null} ? 'Thêm loại sản phẩm' : 'Sửa loại sản phẩm'">
                Thêm loại sản phẩm</h1>

            <div class="alert alert-danger" th:if="${thongBaoLoi}" th:text="${thongBaoLoi}"></div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/admin/loai-san-pham/luu}" th:object="${loaiSanPham}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label" for="tenLoai">Tên loại</label>
                            <input class="form-control" id="tenLoai" th:field="*{tenLoai}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('tenLoai')}"
                                 th:errors="*{tenLoai}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="moTa">Mô tả</label>
                            <textarea class="form-control" id="moTa" rows="3" th:field="*{moTa}"></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('moTa')}"
                                 th:errors="*{moTa}"></div>
                        </div>
                        <button class="btn btn-primary" type="submit">Lưu</button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/loai-san-pham}">Quay lại</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
</body>
</html>
