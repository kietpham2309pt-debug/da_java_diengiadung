<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Loại sản phẩm')}"></head>
<body>
<div th:replace="~{layout/fragments :: menu}"></div>

<main class="container py-4">
    <div class="row g-4">
        <div class="col-lg-3">
            <div th:replace="~{layout/fragments :: menuQuanTri('loai-san-pham')}"></div>
        </div>
        <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h4 mb-0">Quản lý loại sản phẩm</h1>
                <a class="btn btn-primary" th:href="@{/admin/loai-san-pham/them}">Thêm loại</a>
            </div>

            <div th:replace="~{layout/fragments :: thongBao}"></div>

            <form class="row g-2 mb-3" th:action="@{/admin/loai-san-pham}" method="get">
                <div class="col-sm-6">
                    <input class="form-control" name="tuKhoa" placeholder="Tìm theo tên loại" th:value="${tuKhoa}">
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-secondary" type="submit">Tìm</button>
                </div>
                <div class="col-auto" th:if="${tuKhoa != null and !tuKhoa.isBlank()}">
                    <a class="btn btn-link" th:href="@{/admin/loai-san-pham}">Bỏ lọc</a>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-bordered bg-white align-middle">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 70px">Mã</th>
                        <th>Tên loại</th>
                        <th>Mô tả</th>
                        <th style="width: 100px" class="text-center">Số SP</th>
                        <th style="width: 170px" class="text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="loai : ${danhSach}">
                        <td th:text="${loai.id}">1</td>
                        <td th:text="${loai.tenLoai}">Bếp từ</td>
                        <td th:text="${loai.moTa}">Mô tả</td>
                        <td class="text-center" th:text="${#lists.size(loai.danhSachSanPham)}">0</td>
                        <td class="text-center">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{'/admin/loai-san-pham/sua/' + ${loai.id}}">Sửa</a>
                            <form class="d-inline" th:action="@{'/admin/loai-san-pham/xoa/' + ${loai.id}}" method="post"
                                  onsubmit="return confirm('Bạn chắc chắn muốn xoá loại này?');">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Xoá</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(danhSach)}">
                        <td colspan="5" class="text-center text-muted">Chưa có loại sản phẩm nào</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
</body>
</html>
