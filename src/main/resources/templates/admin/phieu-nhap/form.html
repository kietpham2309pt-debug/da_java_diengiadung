<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Lập phiếu nhập', false)}"></head>
<body>
<div th:replace="~{layout/bo-icon :: boIcon}"></div>
<div class="luoi-chuyen" id="luoi-chuyen" aria-hidden="true"></div>
<div th:replace="~{layout/fragments :: thanh}"></div>

<main>
    <section class="muc muc--dau-trang">
        <div class="khung">
            <nav class="duong-dan" aria-label="Đường dẫn phân cấp">
                <a th:href="@{/}">Trang chủ</a>
                <span aria-hidden="true">&middot;</span>
                <a th:href="@{/admin}">Quản trị</a>
                <span aria-hidden="true">&middot;</span>
                <a th:href="@{/admin/phieu-nhap}">Phiếu nhập</a>
                <span aria-hidden="true">&middot;</span>
                <span aria-current="page">Lập phiếu</span>
            </nav>

            <div class="qt">
                <div th:replace="~{layout/fragments :: menuQuanTri('phieu-nhap')}"></div>

                <div>
                    <div class="qt-dau">
                        <div>
                            <h1>Lập phiếu nhập kho</h1>
                        </div>
                    </div>

                    <div th:replace="~{layout/fragments :: thongBao}"></div>

                    <form th:action="@{/admin/phieu-nhap/luu}" th:object="${phieuNhap}" method="post" id="formPhieuNhap">
                        <div class="khoi">
                            <div class="khoi__dau">
                                <h2>Thông tin chung</h2>
                            </div>

                            <div class="o-doi">
                                <div class="o-nhap">
                                    <label for="nhaCungCap">Nhà cung cấp</label>
                                    <div class="ds__o" style="width: 100%;">
                                        <select id="nhaCungCap" name="nhaCungCap" style="width: 100%;" required>
                                            <option value="">-- Chọn nhà cung cấp --</option>
                                            <option th:each="ncc : ${danhSachNCC}" th:value="${ncc.id}" th:text="${ncc.tenNhaCungCap}"></option>
                                        </select>
                                        <svg class="ic"><use xlink:href="#ic-chevron"></use></svg>
                                    </div>
                                </div>
                                <div class="o-nhap">
                                    <label>Ngày nhập</label>
                                    <input type="text" value="Hệ thống tự động tạo khi lưu" disabled>
                                </div>
                            </div>

                            <div class="o-nhap" style="margin-top: 16px;">
                                <label for="ghiChu">Ghi chú</label>
                                <textarea id="ghiChu" rows="2" th:field="*{ghiChu}" placeholder="Ghi chú thêm về lô hàng này..."></textarea>
                            </div>
                        </div>

                        <div class="khoi">
                            <div class="khoi__dau">
                                <h2>Chi tiết sản phẩm nhập</h2>
                                <button type="button" class="nut nut--nho" onclick="themDongSanPham()">Thêm sản phẩm</button>
                            </div>

                            <div class="cuon-ngang">
                                <table class="bang-dl">
                                    <thead>
                                    <tr>
                                        <th>Sản phẩm</th>
                                        <th class="canh-giua">Số lượng</th>
                                        <th class="canh-giua">Giá nhập (₫)</th>
                                        <th class="canh-phai">Thành tiền</th>
                                        <th></th>
                                    </tr>
                                    </thead>
                                    <tbody id="danhSachChiTiet">
                                    </tbody>
                                </table>
                            </div>

                            <div class="tong-phieu">
                                <div>
                                    Tổng tiền phiếu nhập: <b id="tongTienPhieu" class="tong-phieu__so">0 ₫</b>
                                    <input type="hidden" id="tongTienHidden" th:field="*{tongTien}" value="0">
                                </div>
                                <div class="hang-nut">
                                    <button class="nut nut--dac" type="button" onclick="kiemTraVaSubmit()">Lưu phiếu nhập</button>
                                    <a class="nut" th:href="@{/admin/phieu-nhap}">Quay lại</a>
                                </div>
                            </div>
                        </div>
                    </form>


                    <div id="mauSelectSanPham" style="display: none;">
                        <select class="sp-select" style="width: 100%;">
                            <option value="">-- Chọn SP --</option>
                            <option th:each="sp : ${danhSachSP}" th:value="${sp.id}" th:text="${sp.tenSanPham}"></option>
                        </select>
                    </div>

                </div>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
<div th:replace="~{layout/fragments :: menuNho}"></div>

<script>
    let soDong = 0;

    function themDongSanPham() {
        let tbody = document.getElementById("danhSachChiTiet");
        let tr = document.createElement("tr");
        tr.id = `dong_sp_${soDong}`;

        let selectHtml = document.getElementById("mauSelectSanPham").innerHTML;

        tr.innerHTML = `
            <td>
                <div class="o-nhap">
                    <div class="ds__o" style="width: 100%;">
                        ${selectHtml}
                        <svg class="ic"><use xlink:href="#ic-chevron"></use></svg>
                    </div>
                </div>
            </td>
            <td class="canh-giua">
                <div class="o-nhap">
                    <input type="number" class="sp-sl" value="1" min="1" required oninput="tinhThanhTien(${soDong})" style="text-align: center;">
                </div>
            </td>
            <td class="canh-giua">
                <div class="o-nhap">
                    <input type="number" class="sp-gia" value="" min="1000" step="1000" placeholder="Nhập giá..." required oninput="tinhThanhTien(${soDong})" style="text-align: right;">
                </div>
            </td>
            <td class="canh-phai" id="thanh_tien_${soDong}" style="font-weight: bold; vertical-align: middle;">0 ₫</td>
            <td class="canh-giua" style="vertical-align: middle;">
                <button type="button" class="nut nut--nho nut--do" onclick="xoaDong(${soDong})">Xoá</button>
            </td>
        `;

        let selectElement = tr.querySelector(".sp-select");
        selectElement.setAttribute("onchange", `capNhatGia(${soDong})`);

        tbody.appendChild(tr);
        soDong++;
    }

    function capNhatGia(index) {
        tinhThanhTien(index);
    }

    function tinhThanhTien(index) {
        let row = document.getElementById(`dong_sp_${index}`);
        if (!row) return;

        let slInput = row.querySelector(".sp-sl");
        let giaInput = row.querySelector(".sp-gia");
        let thanhTienText = row.querySelector(`#thanh_tien_${index}`);

        let sl = slInput ? (parseInt(slInput.value) || 0) : 0;
        let gia = giaInput ? (parseInt(giaInput.value) || 0) : 0;

        let thanhTien = sl * gia;
        thanhTienText.innerText = thanhTien.toLocaleString('vi-VN') + ' ₫';

        tinhTongTien();
    }

    function xoaDong(index) {
        let row = document.getElementById(`dong_sp_${index}`);
        if (row) {
            row.remove();
            tinhTongTien();
        }
    }

    function tinhTongTien() {
        let tongTien = 0;
        let rows = document.querySelectorAll("#danhSachChiTiet tr");
        rows.forEach(row => {
            let slInput = row.querySelector(".sp-sl");
            let giaInput = row.querySelector(".sp-gia");
            if (slInput && giaInput) {
                tongTien += (parseInt(slInput.value) || 0) * (parseInt(giaInput.value) || 0);
            }
        });
        document.getElementById("tongTienPhieu").innerText = tongTien.toLocaleString('vi-VN') + ' ₫';
        document.getElementById("tongTienHidden").value = tongTien;
    }

    function kiemTraVaSubmit() {

        let nhaCungCap = document.getElementById("nhaCungCap");
        if (!nhaCungCap.value) {
            alert("Vui lòng chọn nhà cung cấp!");
            nhaCungCap.focus();
            return;
        }


        let tbody = document.getElementById("danhSachChiTiet");
        let rows = tbody.querySelectorAll("tr");
        if (rows.length === 0) {
            alert("Vui lòng thêm ít nhất một sản phẩm vào phiếu nhập!");
            return;
        }


        for (let i = 0; i < rows.length; i++) {
            let row = rows[i];
            let sel = row.querySelector(".sp-select");
            let sl = row.querySelector(".sp-sl");
            let gia = row.querySelector(".sp-gia");

            if (!sel.value) {
                alert("Vui lòng chọn sản phẩm ở dòng thứ " + (i + 1) + "!");
                sel.focus();
                return;
            }
            if (!sl.value || parseInt(sl.value) <= 0) {
                alert("Số lượng ở dòng thứ " + (i + 1) + " phải lớn hơn 0!");
                sl.focus();
                return;
            }
            if (!gia.value || parseInt(gia.value) <= 0) {
                alert("Giá nhập ở dòng thứ " + (i + 1) + " phải lớn hơn 0!");
                gia.focus();
                return;
            }
        }


        rows.forEach((row, i) => {
            row.querySelector(".sp-select").name = `danhSachChiTiet[${i}].sanPham`;
            row.querySelector(".sp-sl").name = `danhSachChiTiet[${i}].soLuong`;
            row.querySelector(".sp-gia").name = `danhSachChiTiet[${i}].giaNhap`;
        });

        document.getElementById("formPhieuNhap").submit();
    }


    document.addEventListener("DOMContentLoaded", function () {
        themDongSanPham();
    });
</script>
</body>
</html>
