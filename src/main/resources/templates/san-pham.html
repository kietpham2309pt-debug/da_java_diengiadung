<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang(${tieuDe})}"></head>
<body>
<div th:replace="~{layout/bo-icon :: boIcon}"></div>
<div th:replace="~{layout/fragments :: menu}"></div>

<main class="than">
    <div class="khung">
        <nav class="duong-dan" aria-label="Đường dẫn">
            <a th:href="@{/}">Trang chủ</a>
            <span aria-hidden="true">/</span>
            <span aria-current="page" th:text="${tieuDe}">Sản phẩm</span>
        </nav>

        <div class="dau-trang">
            <div>
                <h1 th:text="${tieuDe}">Tất cả sản phẩm</h1>
                <p th:text="'Có ' + ${#lists.size(danhSachSanPham)} + ' sản phẩm'">Có 0 sản phẩm</p>
            </div>
        </div>

        <div class="hang-loc">
            <form th:action="@{/san-pham}" method="get" role="search">
                <input class="o-nhap" type="search" name="tuKhoa" placeholder="Tìm theo tên sản phẩm"
                       aria-label="Từ khoá tìm kiếm" th:value="${tuKhoa}">
                <button class="nut nut--nho" type="submit">
                    <svg class="ic"><use xlink:href="#ic-tim-kiem"></use></svg>
                    Tìm
                </button>
            </form>
            <a th:href="@{/san-pham}" class="nut nut--vien nut--nho">Tất cả</a>
            <a th:each="loai : ${loaiTrenMenu}" th:href="@{/san-pham(loai=${loai.id})}"
               class="nut nut--vien nut--nho" th:text="${loai.tenLoai}">Bếp từ</a>
        </div>

        <div class="luoi-sp">
            <a th:each="sp : ${danhSachSanPham}" th:href="@{'/san-pham/' + ${sp.id}}" class="the-sp">
                <img class="the-sp__anh" th:if="${sp.hinhAnh != null}" th:src="@{'/uploads/' + ${sp.hinhAnh}}"
                     th:alt="${sp.tenSanPham}">
                <span class="the-sp__hoa" th:if="${sp.hinhAnh == null}" aria-hidden="true">
                    <svg class="ic"><use th:href="'#ic-' + (${sp.loaiSanPham} != null ? ${sp.loaiSanPham.maLoai} : 'combo')"></use></svg>
                </span>
                <span class="the-sp__than">
                    <span class="the-sp__hang" th:text="${sp.thuongHieu != null} ? ${sp.thuongHieu.tenThuongHieu} : ' '">Bosch</span>
                    <span class="the-sp__ten" th:text="${sp.tenSanPham}">Tên sản phẩm</span>
                    <span class="the-sp__ma" th:text="${sp.maSanPham}">MSP</span>
                    <span class="the-sp__gia">
                        <span class="gia" th:text="${#numbers.formatInteger(sp.giaHienTai, 0, 'POINT')} + ' đ'">0 đ</span>
                        <span class="gia-cu" th:if="${sp.giaKhuyenMai != null}"
                              th:text="${#numbers.formatInteger(sp.giaBan, 0, 'POINT')} + ' đ'">0 đ</span>
                    </span>
                    <span class="the-sp__kho" th:classappend="${sp.conHang} ? '' : 'the-sp__kho--het'"
                          th:text="${sp.conHang} ? 'Còn ' + ${sp.soLuongTon} + ' sản phẩm' : 'Hết hàng'">Còn hàng</span>
                </span>
            </a>
        </div>

        <div class="trang-trong" th:if="${#lists.isEmpty(danhSachSanPham)}">
            <svg class="ic"><use xlink:href="#ic-hop-trong"></use></svg>
            <strong>Không tìm thấy sản phẩm nào</strong>
            <span>Thử từ khoá khác hoặc xem toàn bộ danh mục.</span>
            <a th:href="@{/san-pham}" class="nut nut--vien nut--nho" style="margin-top:8px">Xem tất cả sản phẩm</a>
        </div>
    </div>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
<div th:replace="~{layout/fragments :: menuDienThoai}"></div>
</body>
</html>
