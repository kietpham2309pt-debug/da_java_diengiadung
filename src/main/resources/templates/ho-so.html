<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: dauTrang('Hồ sơ của tôi', false)}"></head>
<body>
<div th:replace="~{layout/bo-icon :: boIcon}"></div>
<div class="luoi-chuyen" id="luoi-chuyen" aria-hidden="true"></div>
<div th:replace="~{layout/fragments :: thanh}"></div>

<main>
    <div th:replace="~{layout/fragments :: banner('Hồ sơ của tôi', 'Cập nhật thông tin để đặt hàng nhanh hơn', 'banner-tai-khoan.jpg', 'Hồ sơ của tôi')}"></div>

    <section class="muc muc--sat-banner">
        <div class="khung khung--hep">
            <div th:replace="~{layout/fragments :: thongBao}"></div>

            <div class="the-tk hien-dan">
                <form th:action="@{/ho-so}" th:object="${hoSo}" method="post">
                    <div class="o-nhap">
                        <label for="hoTen">Họ và tên</label>
                        <input type="text" id="hoTen" th:field="*{hoTen}" autocomplete="name">
                        <span class="loi-nhap" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></span>
                    </div>

                    <div class="o-nhap">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}" autocomplete="email">
                        <span class="loi-nhap" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <div class="o-nhap">
                        <label for="soDienThoai">Số điện thoại</label>
                        <input type="tel" id="soDienThoai" th:field="*{soDienThoai}" autocomplete="tel">
                        <span class="loi-nhap" th:if="${#fields.hasErrors('soDienThoai')}" th:errors="*{soDienThoai}"></span>
                    </div>

                    <div class="o-nhap">
                        <label for="diaChi">Địa chỉ</label>
                        <input type="text" id="diaChi" th:field="*{diaChi}" autocomplete="street-address">
                        <span class="loi-nhap" th:if="${#fields.hasErrors('diaChi')}" th:errors="*{diaChi}"></span>
                    </div>

                    <button type="submit" class="nut nut--dac the-tk__gui">Lưu hồ sơ</button>
                </form>

                <p class="the-tk__doi"><a th:href="@{/don-hang}">Xem đơn hàng của tôi</a></p>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{layout/fragments :: chanTrang}"></div>
<div th:replace="~{layout/fragments :: menuNho}"></div>
</body>
</html>
