spring.application.name=diengiadung

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=dien_gia_dung;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:bepne}
spring.datasource.password=${DB_PASS:BepNe@2026}
spring.jpa.properties.hibernate.use_nationalized_character_data=true

spring.jpa.hibernate.ddl-auto=update
