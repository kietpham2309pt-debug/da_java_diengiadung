spring.application.name=diengiadung

spring.datasource.url=jdbc:mysql://localhost:3306/dien_gia_dung?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

duongdan.anh=uploads
server.port=8080

# Đọc hết phần thân yêu cầu khi ảnh vượt 5 MB, để trình duyệt nhận được trang báo lỗi thay vì bị ngắt kết nối
server.tomcat.max-swallow-size=-1
# Tomcat mặc định chỉ nhận 10 phần trong một form multipart, form sản phẩm có ảnh dài hơn thế
server.tomcat.max-part-count=50
