# Sao chep file nay thanh tich-hop.properties (cung thu muc) roi dien thong tin that.
# tich-hop.properties da nam trong .gitignore: KHONG dua token/khoa len GitHub.
# Xem huong dan day du: docs/HUONG_DAN_SEPAY_GHN.md

# ---------- SePay (Test mode) ----------
sepay.bat=true
# Khoa API Key da tao o buoc "Bao mat" khi them webhook tren my.sepay.vn (chi dan phan khoa, khong kem chu Apikey)
sepay.api-key=
# Hoac dung HMAC-SHA256: dan Secret Key vao day (de trong neu dung API Key)
sepay.khoa-hmac=

# Tai khoan ngan hang ao tao trong SePay Test mode (dung de ve ma QR tren trang thanh toan)
# ma-bin: ma BIN ngan hang, vi du MBBank 970422, Vietcombank 970436, ACB 970416, BIDV 970418
cuahang.ngan-hang.ma-bin=970422
cuahang.ngan-hang.ten=MBBank
cuahang.ngan-hang.so-tai-khoan=
cuahang.ngan-hang.chu-tai-khoan=

# ---------- GHN (moi truong staging) ----------
ghn.bat=true
ghn.url=https://dev-online-gateway.ghn.vn
ghn.token=
ghn.shop-id=
# Chuoi bi mat tu dat, khai bao them header X-BepNe-Key voi cung gia tri khi cau hinh webhook tren GHN (de trong = khong kiem tra)
ghn.khoa-webhook=
# Moi san pham coi nhu nang bao nhieu gram, goi hang bao nhieu cm moi canh
ghn.khoi-luong-moi-san-pham-gram=3000
ghn.kich-thuoc-goi-cm=40
